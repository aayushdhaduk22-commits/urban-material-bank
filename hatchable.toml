name = "urban-material-bank"

[auth]
enabled = true
providers = ["email"]

[ai]
required = true
description = "Powers UrbanMate AI, the marketplace chatbot. Connect a supported AI provider in Setup."

# Retired premium and logistics tables are not used by this copy.

[db.tables.user_profiles]
read = "own"
write = "own"

[[secret]]
name = "GEMINI_API_KEY"
provider = "custom"
required = true
expose = false
description = "Server-side Gemini API key used by UrbanMate chat. Keep this secret; never put it in browser code."